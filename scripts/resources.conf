# Live-server resource caps for each component.
# Sized for the current VPS: 2 vCPU, ~3.8 GiB RAM, 2 GiB swap.
# Leave ~650–700 MiB for the OS, Docker daemon, journald, and SSH.
# After edits, run: systemctl start odoo-resources.service
#
# Memory budget (~3860 MiB):
#   Postgres 1024 + Odoo 2048 + Nginx 128 ≈ 3200; remainder is host headroom.

[odoo]
# systemd cgroup hard ceiling for the whole Odoo service (master + workers + cron)
MemoryMax=2G
CPUQuota=150%
TasksMax=4096
# Odoo multiprocess settings written into /opt/odoo/odoo.conf
# Keep workers low on 2 vCPU / 4 GiB (classic 2*cpu+1 would OOM).
workers=2
max_cron_threads=1
limit_memory_soft=671088640
limit_memory_hard=805306368
limit_time_cpu=60
limit_time_real=120
limit_request=8192

[postgres]
# Docker Compose limits for odoo-postgres
mem_limit=1g
cpus=0.8
shm_size=128mb
# postgres -c knobs (tuned for a 1g container)
shared_buffers=256MB
effective_cache_size=768MB
work_mem=4MB
maintenance_work_mem=64MB
max_connections=80

[nginx]
MemoryMax=128M
CPUQuota=30%
TasksMax=512
